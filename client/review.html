<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Leave a Review</title>
<style>
:root{
  --accent:#16a34a; --accent-2:#22c55e; --accent-ink:#fff;
  --ink:#0f1115; --muted:#6b7280; --faint:#9aa0ab;
  --bg:#f5f6f8; --surface:#fff; --line:#e8eaee;
  --r-xl:22px; --r-lg:18px; --r-md:13px;
  --sh-md:0 6px 22px rgba(15,17,21,.08); --sh-lg:0 18px 50px rgba(15,17,21,.16);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;}
.shell{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
#loading{position:fixed;inset:0;background:var(--surface);display:flex;align-items:center;justify-content:center;z-index:50;}
.spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

.hero{background:linear-gradient(150deg,var(--accent),var(--accent-2));color:var(--accent-ink);padding:46px 24px 38px;text-align:center;border-radius:0 0 var(--r-xl) var(--r-xl);}
.hero-av{width:64px;height:64px;border-radius:18px;background:var(--surface);color:var(--accent);font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:var(--sh-lg);}
.hero h1{font-size:25px;font-weight:900;letter-spacing:-.04em;}
.hero p{font-size:14.5px;opacity:.9;margin-top:6px;}

.body{padding:30px 22px;flex:1;}
.stars{display:flex;justify-content:center;gap:8px;margin:6px 0 24px;}
.star{font-size:44px;cursor:pointer;color:var(--line);transition:transform .1s,color .1s;line-height:1;-webkit-text-stroke:0;}
.star.on{color:#f6b900;}
.star:active{transform:scale(1.18);}
.rate-label{text-align:center;font-size:14px;font-weight:700;color:var(--muted);min-height:20px;margin-bottom:22px;}
.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.field{margin-bottom:16px;}
.field input,.field textarea{width:100%;padding:15px 16px;border:2px solid var(--line);border-radius:var(--r-md);font-size:16px;font-family:var(--font);background:var(--surface);color:var(--ink);outline:none;-webkit-appearance:none;}
.field input:focus,.field textarea:focus{border-color:var(--accent);}
.field textarea{min-height:110px;resize:none;line-height:1.5;}
.btn{width:100%;border:none;border-radius:100px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);font-family:var(--font);font-size:17px;font-weight:800;padding:17px;cursor:pointer;box-shadow:var(--sh-md);transition:opacity .15s,transform .08s;}
.btn:active{transform:scale(.98);}
.btn:disabled{background:var(--line);color:var(--faint);box-shadow:none;cursor:not-allowed;}
.err{background:#fef2f2;border:1.5px solid #fecaca;border-radius:var(--r-md);padding:12px 16px;font-size:13px;color:#dc2626;margin-bottom:14px;display:none;font-weight:600;}

.center{padding:70px 28px;text-align:center;display:none;flex:1;flex-direction:column;justify-content:center;}
.center .ic{font-size:74px;margin-bottom:18px;animation:pop .45s cubic-bezier(.18,.89,.32,1.28);}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.center h2{font-size:26px;font-weight:900;letter-spacing:-.04em;margin-bottom:8px;}
.center p{font-size:15px;color:var(--muted);line-height:1.6;}
.gbtn{display:inline-block;margin-top:24px;text-decoration:none;background:var(--ink);color:#fff;border-radius:100px;padding:13px 26px;font-size:15px;font-weight:700;}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div></div>

<div class="shell">
  <!-- Review form -->
  <div id="form-view" style="display:none;flex-direction:column;flex:1;">
    <div class="hero">
      <div class="hero-av" id="av"></div>
      <h1 id="title">How was your visit?</h1>
      <p id="subtitle"></p>
    </div>
    <div class="body">
      <div class="err" id="err"></div>
      <div class="stars" id="stars"></div>
      <div class="rate-label" id="rate-label">Tap to rate</div>
      <div class="field" id="name-field" style="display:none;"><label>Your name</label><input id="r-name" type="text" placeholder="First name" autocomplete="name" /></div>
      <div class="field"><label id="comment-label">Tell us more (optional)</label><textarea id="r-comment" placeholder="What did you love? Anything we could do better?"></textarea></div>
      <button class="btn" id="submit" onclick="R.submit()">Submit review</button>
    </div>
  </div>

  <!-- Thank you -->
  <div id="thanks" class="center">
    <div class="ic" id="thanks-ic">🎉</div>
    <h2 id="thanks-title">Thank you!</h2>
    <p id="thanks-sub">We really appreciate your feedback.</p>
    <a id="g-review" class="gbtn" style="display:none;" target="_blank" rel="noopener">Leave a Google review too →</a>
  </div>

  <!-- Already reviewed / unavailable -->
  <div id="done" class="center">
    <div class="ic">✅</div>
    <h2>You're all set</h2>
    <p id="done-sub">This visit has already been reviewed — thank you!</p>
  </div>
</div>

<script>
const R = {
  slug:'', appt:'', rating:0, info:null,
  async init(){
    const parts=location.pathname.replace(/^\/review\/?/,'').split('/');
    this.slug=(parts[0]||'').split('?')[0];
    this.appt=new URLSearchParams(location.search).get('a')||'';
    if(!this.slug) return this.show('done');
    try{
      const info=await fetch('/api/public/'+this.slug+'/review-info'+(this.appt?'?a='+encodeURIComponent(this.appt):'')).then(r=>r.json());
      if(info.error) return this.show('done');
      this.info=info; this._accent(info.accentColor||'#16a34a');
      document.getElementById('av').textContent=(info.shopName||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
      document.getElementById('title').textContent='How was your visit?';
      document.getElementById('subtitle').textContent=info.service?(info.shopName+' · '+info.service):info.shopName;
      document.title='Review — '+info.shopName;
      if(info.alreadyReviewed){ this.show('done'); this._hideLoading(); return; }
      if(!info.customerName){ document.getElementById('name-field').style.display=''; }
      this._stars();
      this.show('form-view'); document.getElementById('form-view').style.display='flex';
      this._hideLoading();
    }catch(e){ this.show('done'); this._hideLoading(); }
  },
  _accent(hex){ const r=document.documentElement.style; r.setProperty('--accent',hex); r.setProperty('--accent-2',lighten(hex,.14)); },
  _hideLoading(){ document.getElementById('loading').style.display='none'; },
  show(id){ ['form-view','thanks','done'].forEach(x=>{const e=document.getElementById(x);if(e)e.style.display='none';}); const el=document.getElementById(id); if(el)el.style.display=id==='form-view'?'flex':'flex'; },
  _stars(){
    const wrap=document.getElementById('stars'); wrap.innerHTML='';
    for(let i=1;i<=5;i++){ const s=document.createElement('div'); s.className='star'; s.textContent='★'; s.onclick=()=>this.rate(i); s.onmouseover=()=>this._paint(i); wrap.appendChild(s); }
    wrap.onmouseleave=()=>this._paint(this.rating);
  },
  _paint(n){ [...document.querySelectorAll('.star')].forEach((s,i)=>s.classList.toggle('on',i<n)); },
  rate(n){ this.rating=n; this._paint(n); const L=['','Poor','Fair','Good','Great','Excellent!']; document.getElementById('rate-label').textContent=L[n]; this.err(''); },
  err(m){ const e=document.getElementById('err'); e.textContent=m||''; e.style.display=m?'block':'none'; },
  async submit(){
    if(!this.rating) return this.err('Please tap a star rating first.');
    const btn=document.getElementById('submit'); btn.disabled=true; btn.textContent='Sending…';
    try{
      const body={ rating:this.rating, comment:document.getElementById('r-comment').value.trim(), appointmentId:this.appt||undefined };
      if(document.getElementById('name-field').style.display!=='none') body.name=document.getElementById('r-name').value.trim();
      const r=await fetch('/api/public/'+this.slug+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
      if(!r.ok){ this.err(r.error||'Could not submit. Please try again.'); btn.disabled=false; btn.textContent='Submit review'; return; }
      // Happy clients (4-5★) get nudged toward a public Google review if the shop set a link
      if(this.rating>=4 && this.info && this.info.googleReviewLink){ const g=document.getElementById('g-review'); g.href=this.info.googleReviewLink; g.style.display='inline-block'; }
      document.getElementById('thanks-ic').textContent=this.rating>=4?'🎉':'🙏';
      document.getElementById('thanks-sub').textContent=this.rating>=4?'So glad you had a great visit. Thank you!':'Thank you — your feedback helps us improve.';
      this.show('thanks');
    }catch(e){ this.err('Something went wrong. Please try again.'); btn.disabled=false; btn.textContent='Submit review'; }
  },
};
function lighten(hex,amt){ const n=parseInt(hex.slice(1),16); const r=Math.min(255,(n>>16&255)+Math.round(255*amt)),g=Math.min(255,(n>>8&255)+Math.round(255*amt)),b=Math.min(255,(n&255)+Math.round(255*amt)); return '#'+(1<<24|r<<16|g<<8|b).toString(16).slice(1); }
R.init();
</script>
</body>
</html>
