<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="ShopFlow"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<link rel="icon" type="image/png" href="/icons/icon-192.png"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>ShopFlow</title>
<link rel="stylesheet" href="/css/app.css"/>
</head>
<body>

<!-- Loading screen -->
<div id="loading">
  <div id="loading-logo"><img src="/icons/icon-192.png" style="width:52px;height:52px;border-radius:14px;display:block;" /></div>
  <div id="loading-title">ShopFlow</div>
  <div id="loading-sub">Loading your shop...</div>
  <div class="loading-dots">
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
  </div>
</div>

<!-- Mobile sidebar backdrop -->
<div id="sidebar-backdrop" onclick="closeSidebar()"></div>

<!-- Topbar -->
<div id="topbar">
  <button id="topbar-menu-btn" onclick="toggleSidebar()" aria-label="Menu">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="5" x2="17" y2="5"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="15" x2="17" y2="15"/>
    </svg>
  </button>
  <img id="topbar-logo" src="/icons/icon-192.png" style="width:28px;height:28px;border-radius:7px;" />
  <div id="topbar-title">ShopFlow</div>
<script>document.addEventListener("DOMContentLoaded",()=>{const n=localStorage.getItem("sf_shopName");if(n)document.getElementById("topbar-title").textContent=n;});</script>
</div>

<!-- App -->
<div id="app">
  <!-- Sidebar -->
  <div id="sidebar">
    <div style="padding:14px 16px 10px;border-bottom:1px solid var(--border);margin-bottom:6px;display:flex;align-items:center;gap:10px;">
      <img src="/icons/icon-192.png" style="width:34px;height:34px;border-radius:9px;flex-shrink:0;" />
      <div style="flex:1;">
        <div style="font-size:15px;font-weight:800;color:var(--text);letter-spacing:-.03em;">ShopFlow</div>
        <div id="sidebar-shop-name" style="font-size:11px;color:var(--muted);margin-top:1px;">Your Shop</div>
      </div>
      <button id="sidebar-close-btn" onclick="closeSidebar()" style="background:none;border:none;color:var(--faint);cursor:pointer;padding:4px;border-radius:6px;display:none;">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="4" x2="14" y2="14"/><line x1="14" y1="4" x2="4" y2="14"/></svg>
      </button>
    </div>
    <div class="nav-section">Menu</div>
    <div class="nav-item active" data-page="dashboard"    onclick="App.nav('dashboard');closeSidebar()"><span class="nav-item-icon">🏠</span>Dashboard</div>
    <div class="nav-item" data-page="messages"            onclick="App.nav('messages');closeSidebar()">
      <span class="nav-item-icon">💬</span>Messages
      <span id="sidebar-msg-badge" class="nav-badge" style="display:none;"></span>
    </div>
    <div class="nav-item" data-page="appointments"        onclick="App.nav('appointments');closeSidebar()"><span class="nav-item-icon">📅</span>Appointments</div>
    <div class="nav-item" data-page="leads"               onclick="App.nav('leads');closeSidebar()"><span class="nav-item-icon">📞</span>Leads</div>
    <div class="nav-item" data-page="clients"             onclick="App.nav('clients');closeSidebar()"><span class="nav-item-icon">👤</span>Clients</div>
    <div class="nav-item" data-page="quotes"              onclick="App.nav('quotes');closeSidebar()"><span class="nav-item-icon">📄</span>Estimates</div>
    <div class="nav-item" data-page="revenue"             onclick="App.nav('revenue');closeSidebar()"><span class="nav-item-icon">📈</span>Revenue</div>
    <div class="nav-item" data-page="reviews"             onclick="App.nav('reviews');closeSidebar()"><span class="nav-item-icon">⭐</span>Reviews</div>
    <div class="nav-item" data-page="automations"         onclick="App.nav('automations');closeSidebar()"><span class="nav-item-icon">⚡</span>Automations</div>
    <div class="nav-item" data-page="settings"            onclick="App.nav('settings');closeSidebar()"><span class="nav-item-icon">⚙️</span>Settings</div>
    <div id="sidebar-footer">
      <div style="font-size:11px;color:var(--faint);">Powered by <strong style="color:var(--green);">ShopFlow</strong></div>
    </div>
  </div>

  <!-- Main content -->
  <div id="main">
    <div id="page-dashboard"    class="page active"></div>
    <div id="page-messages"     class="page"></div>
    <div id="page-appointments" class="page"></div>
    <div id="page-leads"        class="page"></div>
    <div id="page-clients"      class="page"></div>
    <div id="page-quotes"       class="page"></div>
    <div id="page-revenue"      class="page"></div>
    <div id="page-reviews"      class="page"></div>
    <div id="page-automations"  class="page"></div>
    <div id="page-settings"     class="page"></div>
  </div>
</div>

<!-- Bottom nav (mobile) -->
<div id="bottom-nav">
  <button class="bottom-nav-item active" data-page="dashboard" onclick="App.nav('dashboard')"><span class="bottom-nav-icon">🏠</span>Home</button>
  <button class="bottom-nav-item" data-page="appointments" onclick="App.nav('appointments')"><span class="bottom-nav-icon">📅</span>Bookings</button>
  <button class="bottom-nav-item" data-page="messages" onclick="App.nav('messages')" style="position:relative;">
    <span class="bottom-nav-icon">💬</span>Messages
    <span id="bottom-msg-badge" style="display:none;position:absolute;top:4px;right:calc(50% - 18px);background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:100px;line-height:1.4;"></span>
  </button>
  <button class="bottom-nav-item" data-page="revenue" onclick="App.nav('revenue')"><span class="bottom-nav-icon">📈</span>Revenue</button>
  <button class="bottom-nav-item" data-page="settings" onclick="App.nav('settings')"><span class="bottom-nav-icon">⚙️</span>Settings</button>
</div>

<!-- Global client profile overlay -->
<div id="cp-overlay">
  <div id="cp-header">
    <button id="cp-back-btn" onclick="ClientProfile.close()">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="13 16 7 10 13 4"/>
      </svg>
    </button>
    <div id="cp-header-name">Client Profile</div>
    <div style="width:36px;"></div>
  </div>
  <div id="cp-body"></div>
</div>

<!-- Modal -->
<div id="modal-overlay">
  <div id="modal-box"></div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script src="/js/api.js"></script>
<script>if(!localStorage.getItem("sf_token")){window.location.href="/login";}</script>
<script src="/js/utils.js"></script>
<script src="/js/client-profile.js"></script>
<script src="/js/pages/dashboard.js"></script>
<script src="/js/pages/appointments.js"></script>
<script src="/js/pages/leads.js"></script>
<script src="/js/pages/clients.js"></script>
<script src="/js/pages/quotes.js"></script>
<script src="/js/pages/revenue.js"></script>
<script src="/js/pages/reviews.js"></script>
<script src="/js/pages/automations.js"></script>
<script src="/js/pages/settings.js"></script>
<script src="/js/pages/messages.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
