<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Book an Appointment</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --green:#16a34a;--green-lt:#f0fdf4;--green-md:#bbf7d0;
  --text:#1d1d1f;--muted:#6e6e73;--faint:#aeaeb2;
  --border:#d2d2d7;--surface:#f5f5f7;--white:#fff;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --radius:14px;--shadow:0 2px 20px rgba(0,0,0,.08);
}
html,body{height:100%;background:var(--surface);font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased;}

/* ── Loading ── */
#loading{position:fixed;inset:0;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .3s;}
#loading.fade{opacity:0;pointer-events:none;}
.loading-spinner{width:32px;height:32px;border:3px solid var(--green-md);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Layout ── */
.wrap{max-width:480px;margin:0 auto;padding:0 0 80px;}

/* ── Shop Header ── */
.shop-header{padding:36px 20px 24px;text-align:center;}
.shop-avatar{width:68px;height:68px;border-radius:18px;background:var(--green);color:#fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;letter-spacing:-.03em;box-shadow:0 4px 16px rgba(22,163,74,.3);}
.shop-name{font-size:24px;font-weight:800;letter-spacing:-.04em;color:var(--text);}
.shop-tagline{font-size:14px;color:var(--muted);margin-top:5px;line-height:1.4;}
.shop-msg{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.5;padding:0 16px;}

/* ── Progress ── */
.progress{display:flex;align-items:center;justify-content:center;padding:0 20px 28px;}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .25s;}
.step-dot.done{background:var(--green);}
.step-dot.active{width:24px;border-radius:4px;background:var(--green);}
.step-line{flex:1;height:1px;background:var(--border);max-width:36px;margin:0 4px;transition:background .25s;}
.step-line.done{background:var(--green);}

/* ── Step titles ── */
.step-title{font-size:21px;font-weight:800;letter-spacing:-.04em;padding:0 20px;margin-bottom:14px;}

/* ── Service cards ── */
.service-grid{display:flex;flex-direction:column;gap:10px;padding:0 20px;}
.service-card{background:var(--white);border:2px solid var(--border);border-radius:var(--radius);padding:17px;cursor:pointer;transition:border-color .15s,background .15s;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);}
.service-card:active{transform:scale(.98);}
.service-card.selected{border-color:var(--green);background:var(--green-lt);}
.service-icon{width:44px;height:44px;border-radius:11px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.service-card.selected .service-icon{background:var(--green-md);}
.service-name{font-size:15px;font-weight:700;color:var(--text);}
.service-meta{font-size:12px;color:var(--muted);margin-top:2px;}
.service-price{margin-left:auto;font-size:18px;font-weight:800;color:var(--green);flex-shrink:0;}

/* ── Barber row ── */
.barber-row{display:flex;gap:10px;padding:0 20px 20px;overflow-x:auto;scrollbar-width:none;}
.barber-row::-webkit-scrollbar{display:none;}
.barber-card{flex-shrink:0;width:104px;background:var(--white);border:2px solid var(--border);border-radius:var(--radius);padding:16px 10px;cursor:pointer;transition:border-color .15s,background .15s;text-align:center;box-shadow:var(--shadow);}
.barber-card:active{transform:scale(.97);}
.barber-card.selected{border-color:var(--green);background:var(--green-lt);}
.barber-avatar{width:46px;height:46px;border-radius:50%;margin:0 auto 9px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff;}
.barber-card-name{font-size:12px;font-weight:700;color:var(--text);line-height:1.3;}
.barber-card-sub{font-size:11px;color:var(--muted);margin-top:2px;}

/* ── Calendar ── */
.cal-wrap{padding:0 20px;margin-bottom:20px;}
.cal{background:var(--white);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-nav-btn{width:36px;height:36px;border:none;background:var(--surface);border-radius:9px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);}
.cal-month{font-size:15px;font-weight:700;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-dh{text-align:center;font-size:11px;font-weight:700;color:var(--faint);padding:4px 0;}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;transition:background .1s,color .1s;position:relative;}
.cal-day:active{transform:scale(.9);}
.cal-day.is-today{color:var(--green);font-weight:800;}
.cal-day.is-sel{background:var(--green)!important;color:#fff!important;font-weight:800;}
.cal-day.is-past,.cal-day.is-blocked{color:var(--faint);cursor:not-allowed;pointer-events:none;}

/* ── Time slots ── */
.slots-section{padding:0 20px 16px;}
.slots-label{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.08em;margin-bottom:10px;}
.slots-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.slot{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:11px 8px;text-align:center;font-size:14px;font-weight:600;cursor:pointer;transition:all .12s;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.04);}
.slot:active{transform:scale(.94);}
.slot.sel-slot{background:var(--green);border-color:var(--green);color:#fff;}
.no-slots{text-align:center;padding:24px 0;color:var(--faint);font-size:14px;}

/* ── Form ── */
.form-wrap{padding:0 20px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:7px;}
.field input,.field textarea{width:100%;padding:15px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:16px;font-family:var(--font);background:var(--white);color:var(--text);outline:none;transition:border-color .15s;-webkit-appearance:none;}
.field input:focus,.field textarea:focus{border-color:var(--text);}
.field input::placeholder,.field textarea::placeholder{color:var(--faint);}
.field textarea{min-height:82px;resize:none;line-height:1.5;}

/* ── Summary ── */
.summary-card{background:var(--white);border-radius:var(--radius);overflow:hidden;margin:0 20px 16px;box-shadow:var(--shadow);}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--surface);}
.summary-row:last-child{border:none;}
.summary-label{font-size:13px;color:var(--muted);}
.summary-val{font-size:13px;font-weight:700;text-align:right;}

/* ── Deposit banner ── */
.dep-banner{background:#fffbeb;border:1.5px solid #fde68a;border-radius:12px;padding:14px 16px;margin:0 20px 20px;display:flex;gap:12px;align-items:flex-start;}
.dep-icon{font-size:22px;line-height:1.2;flex-shrink:0;}
.dep-txt{font-size:13px;color:#92400e;line-height:1.5;}
.dep-amt{font-size:15px;font-weight:800;color:#92400e;margin-top:3px;}

/* ── Buttons ── */
.cta{padding:0 20px;}
.btn-main{width:100%;padding:17px;border:none;border-radius:14px;font-size:17px;font-weight:700;font-family:var(--font);cursor:pointer;background:var(--text);color:var(--white);transition:opacity .15s;letter-spacing:-.02em;margin-bottom:10px;}
.btn-main:active{opacity:.82;}
.btn-main:disabled{opacity:.32;cursor:not-allowed;}
.btn-main.green-btn{background:var(--green);}
.btn-back{width:100%;padding:13px;border:none;background:none;font-size:15px;font-weight:600;font-family:var(--font);color:var(--muted);cursor:pointer;}
.btn-back:active{opacity:.6;}

/* ── Confirmation ── */
#confirmed{display:none;max-width:480px;margin:0 auto;padding:60px 20px 40px;text-align:center;}
.conf-icon{font-size:72px;animation:pop .4s cubic-bezier(.175,.885,.32,1.275);margin-bottom:22px;}
@keyframes pop{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
.conf-title{font-size:26px;font-weight:800;letter-spacing:-.04em;margin-bottom:8px;}
.conf-sub{font-size:15px;color:var(--muted);line-height:1.6;margin-bottom:28px;}
.conf-card{background:var(--white);border-radius:var(--radius);padding:20px;text-align:left;box-shadow:var(--shadow);margin-bottom:20px;}

/* ── Closed ── */
#closed{display:none;max-width:480px;margin:0 auto;padding:100px 20px;text-align:center;}
.closed-icon{font-size:56px;margin-bottom:20px;}
.closed-title{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-bottom:10px;}
.closed-sub{font-size:14px;color:var(--muted);line-height:1.7;}

/* ── Error ── */
.err-banner{background:#fff5f5;border:1.5px solid #fecaca;border-radius:10px;padding:12px 16px;font-size:13px;color:#dc2626;margin:0 20px 16px;display:none;line-height:1.5;}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="loading-spinner"></div>
  <div style="font-size:14px;color:var(--muted);">Loading...</div>
</div>

<!-- Booking closed -->
<div id="closed">
  <div class="closed-icon"><img src="/icons/icon-192.png" style="width:56px;height:56px;border-radius:16px;" /></div>
  <div class="closed-title">Booking Unavailable</div>
  <div class="closed-sub">Online booking is currently turned off for this shop.<br>Please reach out to them directly to schedule.</div>
</div>

<!-- Confirmed -->
<div id="confirmed">
  <div class="conf-icon">🎉</div>
  <div class="conf-title">You're booked!</div>
  <div class="conf-sub" id="conf-sub"></div>
  <div class="conf-card" id="conf-detail"></div>
  <div style="font-size:13px;color:var(--faint);" id="conf-sms"></div>
</div>

<!-- App -->
<div id="app" style="display:none;">
<div class="wrap">

  <!-- Header -->
  <div class="shop-header">
    <div class="shop-avatar" id="sh-av"><img src="/icons/icon-192.png" style="width:100%;height:100%;border-radius:inherit;object-fit:cover;" /></div>
    <div class="shop-name" id="sh-name"></div>
    <div class="shop-tagline" id="sh-tag"></div>
    <div class="shop-msg" id="sh-msg"></div>
  </div>

  <!-- Progress -->
  <div class="progress">
    <div class="step-dot active" id="pd-1"></div>
    <div class="step-line" id="pl-1"></div>
    <div class="step-dot" id="pd-2"></div>
    <div class="step-line" id="pl-2"></div>
    <div class="step-dot" id="pd-3"></div>
    <div class="step-line" id="pl-3"></div>
    <div class="step-dot" id="pd-4"></div>
  </div>

  <!-- Error -->
  <div class="err-banner" id="err"></div>

  <!-- Step 1: Service -->
  <div id="s1">
    <div class="step-title">Choose a service</div>
    <div class="service-grid" id="svc-list"></div>
    <div style="padding:20px 20px 0;">
      <button class="btn-main" id="s1-btn" disabled onclick="B.go(2)">Continue →</button>
    </div>
  </div>

  <!-- Step 2: Barber + Date/Time -->
  <div id="s2" style="display:none;">
    <div class="step-title">Choose a barber</div>
    <div class="barber-row" id="barber-row"></div>

    <div class="step-title" style="margin-bottom:14px;">Pick a date</div>
    <div class="cal-wrap">
      <div class="cal">
        <div class="cal-nav">
          <button class="cal-nav-btn" onclick="B.cMonth(-1)">‹</button>
          <div class="cal-month" id="cal-lbl"></div>
          <button class="cal-nav-btn" onclick="B.cMonth(1)">›</button>
        </div>
        <div class="cal-grid" id="cal-hdr"></div>
        <div class="cal-grid" id="cal-body"></div>
      </div>
    </div>

    <div class="slots-section" id="slots-sec" style="display:none;">
      <div class="slots-label" id="slots-lbl"></div>
      <div class="slots-grid" id="slots-body"></div>
    </div>

    <div style="padding:0 20px;">
      <button class="btn-main" id="s2-btn" disabled onclick="B.go(3)">Continue →</button>
      <button class="btn-back" onclick="B.go(1)">← Back</button>
    </div>
  </div>

  <!-- Step 3: Details -->
  <div id="s3" style="display:none;">
    <div class="step-title">Your info</div>
    <div class="form-wrap">
      <div class="field"><label>FULL NAME *</label><input id="f-name" type="text" placeholder="e.g. Marcus Williams" autocomplete="name" /></div>
      <div class="field"><label>PHONE NUMBER *</label><input id="f-phone" type="tel" placeholder="(505) 555-0100" autocomplete="tel" inputmode="tel" /></div>
      <div class="field"><label>EMAIL (optional)</label><input id="f-email" type="email" placeholder="you@email.com" autocomplete="email" /></div>
      <div class="field"><label>NOTES (optional)</label><textarea id="f-notes" placeholder="Anything the barber should know..."></textarea></div>
      <button class="btn-main" onclick="B.go(4)">Review Booking →</button>
      <button class="btn-back" onclick="B.go(2)">← Back</button>
    </div>
  </div>

  <!-- Step 4: Review -->
  <div id="s4" style="display:none;">
    <div class="step-title">Review & confirm</div>
    <div class="summary-card" id="sum-card"></div>
    <div class="dep-banner" id="dep-banner" style="display:none;">
      <div class="dep-icon">💳</div>
      <div>
        <div class="dep-txt" id="dep-msg"></div>
        <div class="dep-amt" id="dep-amt"></div>
      </div>
    </div>
    <div class="cta">
      <button class="btn-main" id="s4-btn" onclick="B.confirm()">Confirm Appointment</button>
      <button class="btn-back" onclick="B.go(3)">← Back</button>
    </div>
  </div>

</div>
</div>

<script>
const B = {
  slug: '',
  shop: null,
  step: 1,
  sel: { svcId:null, svcName:'', svcPrice:0, svcDur:45, barberId:null, barberName:'', date:null, time:null, name:'', phone:'', email:'', notes:'' },
  _cal: new Date(),
  _cache: {},

  async init() {
    this.slug = location.pathname.replace(/^\/book\/?/,'').split('/')[0].split('?')[0];
    if (!this.slug) { this.closed(); return; }
    try {
      const info = await fetch('/api/public/'+this.slug+'/info').then(r=>r.json());
      if (!info.shopName || info.bookingEnabled===false) { this.closed(); return; }
      this.shop = info;
      this._header(info);
      this._svcs(info.services||[]);
      document.getElementById('app').style.display='';
      const ld = document.getElementById('loading');
      ld.classList.add('fade'); setTimeout(()=>ld.style.display='none',320);
    } catch(e) { this.closed(); }
  },

  _header(i) {
    const av = document.getElementById('sh-av');
    av.textContent = i.shopName.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    av.style.background = i.accentColor||'#16a34a';
    av.style.boxShadow = '0 4px 16px '+hex2rgba(i.accentColor||'#16a34a',.28);
    document.getElementById('sh-name').textContent = i.shopName;
    document.getElementById('sh-tag').textContent  = i.tagline||'';
    const m = (i.bookingMessage||'').replace('Book your appointment below!','');
    document.getElementById('sh-msg').textContent  = m;
    document.title = 'Book — '+i.shopName;
  },

  _svcIcon(c){ return {cut:'✂️',beard:'🪒',combo:'✂️',color:'🎨',design:'💈',other:'💈'}[c]||'✂️'; },

  _svcs(svcs) {
    document.getElementById('svc-list').innerHTML = svcs.length
      ? svcs.map(s=>`<div class="service-card" id="sc-${s.id}" onclick="B.pickSvc('${s.id}','${es(s.name)}',${s.price},${s.duration||45},'${s.category||'cut'}')">
          <div class="service-icon">${this._svcIcon(s.category)}</div>
          <div style="flex:1;"><div class="service-name">${s.name}</div><div class="service-meta">${s.duration||45} min</div></div>
          <div class="service-price">$${s.price}</div>
        </div>`).join('')
      : '<div style="padding:24px;text-align:center;color:var(--faint);">No services listed yet.</div>';
  },

  pickSvc(id,name,price,dur) {
    document.querySelectorAll('.service-card').forEach(c=>c.classList.remove('selected'));
    document.getElementById('sc-'+id)?.classList.add('selected');
    Object.assign(this.sel,{svcId:id,svcName:name,svcPrice:price,svcDur:dur});
    document.getElementById('s1-btn').disabled=false;
  },

  go(n) {
    if (n===4) {
      const name  = document.getElementById('f-name')?.value.trim();
      const phone = document.getElementById('f-phone')?.value.trim();
      if (!name)  { this.err('Please enter your full name.'); return; }
      if (!phone||phone.replace(/\D/g,'').length<10) { this.err('Please enter a valid phone number.'); return; }
      Object.assign(this.sel,{name,phone,email:document.getElementById('f-email')?.value.trim()||'',notes:document.getElementById('f-notes')?.value.trim()||''});
      this._summary();
    }
    this.err('');
    document.getElementById('s'+this.step).style.display='none';
    if (n===2 && this.step===1) { this._barbers(this.shop.barbers||[]); this._cal=new Date(); this._calDraw(); }
    this.step=n;
    document.getElementById('s'+n).style.display='';
    this._prog(n);
    window.scrollTo({top:0,behavior:'smooth'});
  },

  _prog(step) {
    for(let i=1;i<=4;i++){
      const d=document.getElementById('pd-'+i); if(!d)continue;
      d.classList.remove('active','done');
      if(i<step)d.classList.add('done'); else if(i===step)d.classList.add('active');
    }
    for(let i=1;i<=3;i++){const l=document.getElementById('pl-'+i);if(l)l.classList.toggle('done',i<step);}
  },

  err(msg){const e=document.getElementById('err');if(e){e.textContent=msg;e.style.display=msg?'block':'none';}},

  _barbers(barbs) {
    const ini = n=>n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    let h=`<div class="barber-card selected" id="b-any" onclick="B.pickBarber(null,'')">
      <div class="barber-avatar" style="background:#6e6e73;font-size:20px;">✂</div>
      <div class="barber-card-name">Any Barber</div>
      <div class="barber-card-sub">First available</div></div>`;
    barbs.forEach(b=>{h+=`<div class="barber-card" id="b-${b.id}" onclick="B.pickBarber('${b.id}','${es(b.name)}')">
      <div class="barber-avatar" style="background:${b.color||'#16a34a'}">${ini(b.name)}</div>
      <div class="barber-card-name">${b.name}</div>
      <div class="barber-card-sub">${b.bio||'Chair '+b.chair}</div></div>`;});
    document.getElementById('barber-row').innerHTML=h;
    this.sel.barberId=null; this.sel.barberName='';
  },

  pickBarber(id,name){
    document.querySelectorAll('.barber-card').forEach(c=>c.classList.remove('selected'));
    document.getElementById(id?'b-'+id:'b-any')?.classList.add('selected');
    this.sel.barberId=id; this.sel.barberName=name;
    this.sel.time=null; document.getElementById('s2-btn').disabled=true;
    if(this.sel.date){this._cache={};this._slots(this.sel.date);}
  },

  _calDraw(){
    const DAYS=['S','M','T','W','T','F','S'];
    document.getElementById('cal-hdr').innerHTML=DAYS.map(d=>`<div class="cal-dh">${d}</div>`).join('');
    this._calBody();
  },

  _calBody(){
    const y=this._cal.getFullYear(),m=this._cal.getMonth();
    document.getElementById('cal-lbl').textContent=this._cal.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
    const todayStr=new Date().toISOString().split('T')[0];
    const blocked=new Set(this.shop.blockedDates||[]);
    let h='';
    for(let i=0;i<first;i++)h+='<div></div>';
    for(let d=1;d<=days;d++){
      const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const past=ds<todayStr, bl=blocked.has(ds), sel=ds===this.sel.date, tod=ds===todayStr;
      let cls='cal-day';
      if(past||bl)cls+=' is-past'; else if(sel)cls+=' is-sel'; else if(tod)cls+=' is-today';
      h+=`<div class="${cls}" onclick="B.pickDate('${ds}')">${d}</div>`;
    }
    document.getElementById('cal-body').innerHTML=h;
  },

  cMonth(d){this._cal=new Date(this._cal.getFullYear(),this._cal.getMonth()+d,1);this._calBody();},

  async pickDate(date){
    if(date<new Date().toISOString().split('T')[0])return;
    this.sel.date=date; this.sel.time=null; document.getElementById('s2-btn').disabled=true;
    this._calBody(); await this._slots(date);
  },

  async _slots(date){
    const key=date+(this.sel.barberId||'any');
    const sec=document.getElementById('slots-sec'),body=document.getElementById('slots-body'),lbl=document.getElementById('slots-lbl');
    sec.style.display='';
    const dt=new Date(date+'T12:00:00');
    lbl.textContent=dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();
    body.innerHTML='<div class="no-slots" style="font-size:13px;">Checking availability…</div>';
    if(this._cache[key]){this._renderSlots(this._cache[key]);return;}
    try{
      const qs='?date='+date+(this.sel.barberId?'&barberId='+this.sel.barberId:'');
      const slots=await fetch('/api/public/'+this.slug+'/availability'+qs).then(r=>r.json());
      this._cache[key]=slots; this._renderSlots(slots);
    }catch(e){body.innerHTML='<div class="no-slots">Could not load times. Try again.</div>';}
  },

  _renderSlots(slots){
    const body=document.getElementById('slots-body');
    if(!slots.length){body.innerHTML='<div class="no-slots">No availability on this day.</div>';return;}
    body.innerHTML=slots.map(t=>`<div class="slot${t===this.sel.time?' sel-slot':''}" onclick="B.pickTime('${t}')">${t}</div>`).join('');
  },

  pickTime(t){
    this.sel.time=t;
    document.querySelectorAll('.slot').forEach(s=>s.classList.toggle('sel-slot',s.textContent.trim()===t));
    document.getElementById('s2-btn').disabled=false;
  },

  _summary(){
    const s=this.sel, dep=this.shop.deposit;
    const dt=new Date(s.date+'T12:00:00');
    const dateStr=dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    document.getElementById('sum-card').innerHTML=`
      <div class="summary-row"><div class="summary-label">Service</div><div class="summary-val">${s.svcName}</div></div>
      <div class="summary-row"><div class="summary-label">Price</div><div class="summary-val" style="color:var(--green);font-size:17px;">$${s.svcPrice}</div></div>
      ${s.barberName?`<div class="summary-row"><div class="summary-label">Barber</div><div class="summary-val">${s.barberName}</div></div>`:''}
      <div class="summary-row"><div class="summary-label">Date</div><div class="summary-val">${dateStr}</div></div>
      <div class="summary-row"><div class="summary-label">Time</div><div class="summary-val">${s.time}</div></div>
      <div class="summary-row"><div class="summary-label">Name</div><div class="summary-val">${s.name}</div></div>
      <div class="summary-row"><div class="summary-label">Phone</div><div class="summary-val">${s.phone}</div></div>
      ${s.notes?`<div class="summary-row"><div class="summary-label">Notes</div><div class="summary-val" style="font-weight:400;">${s.notes}</div></div>`:''}
    `;
    const db=document.getElementById('dep-banner'), btn=document.getElementById('s4-btn');
    if(dep?.enabled){
      document.getElementById('dep-msg').textContent=dep.message||'A deposit is required to secure your spot.';
      document.getElementById('dep-amt').textContent='$'+dep.amount+' deposit due now';
      db.style.display='flex';
      btn.textContent='Pay $'+dep.amount+' Deposit & Book →';
      btn.classList.add('green-btn');
    }else{db.style.display='none';btn.textContent='Confirm Appointment';btn.classList.remove('green-btn');}
  },

  async confirm(){
    const btn=document.getElementById('s4-btn');
    btn.disabled=true; btn.textContent='Booking…';
    const s=this.sel, dep=this.shop.deposit;
    try{
      const bookRes=await fetch('/api/public/'+this.slug+'/book',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({customerName:s.name,customerPhone:s.phone,customerEmail:s.email,barberId:s.barberId,barberName:s.barberName,serviceId:s.svcId,serviceName:s.svcName,servicePrice:s.svcPrice,date:s.date,time:s.time,notes:s.notes,status:dep?.enabled?'pending-deposit':'confirmed'})
      }).then(r=>r.json());
      if(!bookRes.ok){this.err(bookRes.error||'Booking failed. Please try again.');btn.disabled=false;btn.textContent='Confirm Appointment';return;}

      if(dep?.enabled){
        const depRes=await fetch('/api/public/'+this.slug+'/deposit-session',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({appointmentId:bookRes.appointmentId,amount:dep.amount})
        }).then(r=>r.json());
        if(depRes.ok&&depRes.url){window.location.href=depRes.url;return;}
        // deposit session failed — still show confirmation (appointment exists)
      }

      this._confirmed(bookRes.smsSent);
    }catch(e){this.err('Something went wrong. Please try again.');btn.disabled=false;btn.textContent='Confirm Appointment';}
  },

  _confirmed(smsSent){
    document.getElementById('app').style.display='none';
    const s=this.sel;
    const dt=new Date(s.date+'T12:00:00');
    const dateStr=dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    document.getElementById('conf-sub').textContent='See you '+dateStr+' at '+s.time+'!';
    document.getElementById('conf-detail').innerHTML=`
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;justify-content:space-between;"><span style="font-size:13px;color:var(--muted);">Service</span><span style="font-size:13px;font-weight:700;">${s.svcName}</span></div>
        ${s.barberName?`<div style="display:flex;justify-content:space-between;"><span style="font-size:13px;color:var(--muted);">Barber</span><span style="font-size:13px;font-weight:700;">${s.barberName}</span></div>`:''}
        <div style="display:flex;justify-content:space-between;"><span style="font-size:13px;color:var(--muted);">Date</span><span style="font-size:13px;font-weight:700;">${dateStr}</span></div>
        <div style="display:flex;justify-content:space-between;"><span style="font-size:13px;color:var(--muted);">Time</span><span style="font-size:13px;font-weight:700;">${s.time}</span></div>
        <div style="display:flex;justify-content:space-between;"><span style="font-size:13px;color:var(--muted);">Shop</span><span style="font-size:13px;font-weight:700;">${this.shop.shopName}</span></div>
      </div>`;
    document.getElementById('conf-sms').textContent=smsSent?'📱 Confirmation text sent to '+s.phone:'';
    document.getElementById('confirmed').style.display='block';
    window.scrollTo({top:0,behavior:'smooth'});
  },

  closed(){
    document.getElementById('loading').style.display='none';
    document.getElementById('closed').style.display='block';
  },
};

function es(s){return String(s||'').replace(/'/g,"\\'");}
function hex2rgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}

B.init();
</script>
</body>
</html>
