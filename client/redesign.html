<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ShopFlow CRM — Product Demo</title>
<style>
:root{
  --bg:#F5F7F6; --card:#FFFFFF; --border:#E5EAE7; --border-md:#D7DEDA;
  --ink:#141F1A; --muted:#5C6B63; --faint:#93A29A;
  --em:#0E9F6E; --em-deep:#065F41; --em-tint:#E7F6EF; --em-mid:#BBE5D2;
  --amber:#B45309; --amber-tint:#FBF1E2; --red:#B42318; --red-tint:#FBEDEB;
  --blue:#155EEF; --blue-tint:#EAF0FD;
  --shadow:0 1px 2px rgba(20,31,26,.05),0 1px 3px rgba(20,31,26,.04);
  --shadow-lg:0 4px 16px rgba(20,31,26,.10),0 1px 3px rgba(20,31,26,.06);
  --r:10px; --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13.5px/1.5 var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--em-deep);text-decoration:none}
::placeholder{color:var(--faint)}
:focus-visible{outline:2px solid var(--em);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}

/* ── shell ── */
#shell{display:flex;min-height:100vh}
#sidebar{width:224px;background:var(--card);border-right:1px solid var(--border);position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:40;transition:transform .2s ease}
#brand{display:flex;align-items:center;gap:10px;padding:16px 18px 14px}
#brand .logo{width:30px;height:30px;border-radius:8px;background:var(--em-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:-.02em}
#brand .nm{font-size:14.5px;font-weight:700;letter-spacing:-.02em}
#brand .demo{margin-left:auto;font-size:10px;font-weight:600;color:var(--muted);border:1px solid var(--border);border-radius:99px;padding:1px 7px}
.navsec{padding:14px 18px 4px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.navitem{display:flex;align-items:center;gap:10px;width:calc(100% - 16px);margin:1px 8px;padding:7px 10px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted);text-align:left}
.navitem svg{width:16px;height:16px;flex-shrink:0}
.navitem:hover{background:var(--bg);color:var(--ink)}
.navitem.on{background:var(--em-tint);color:var(--em-deep);font-weight:600}
.navitem .ct{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.navitem.on .ct{color:var(--em-deep)}
#sidefoot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--border);font-size:11px;color:var(--faint)}
#sidefoot b{color:var(--em-deep)}

#topbar{position:fixed;top:0;left:224px;right:0;height:56px;background:rgba(245,247,246,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 24px;z-index:30}
#hamb{display:none;padding:6px}
#searchwrap{position:relative;width:340px}
#gsearch{width:100%;height:34px;border:1px solid var(--border);border-radius:8px;background:var(--card);padding:0 12px 0 34px;font-size:13px}
#gsearch:hover{border-color:var(--border-md)}
#searchwrap .sic{position:absolute;left:11px;top:9px;width:15px;height:15px;color:var(--faint);pointer-events:none}
#searchdrop{position:absolute;top:40px;left:0;width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);display:none;overflow:hidden}
#searchdrop.open{display:block}
.sd-row{display:flex;align-items:center;gap:10px;padding:9px 12px;width:100%;text-align:left;font-size:13px}
.sd-row:hover{background:var(--bg)}
.sd-row .k{color:var(--faint);font-size:11px;margin-left:auto}
.sd-empty{padding:14px 12px;color:var(--faint);font-size:12.5px}
#topbar .sp{flex:1}
.iconbtn{position:relative;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid transparent}
.iconbtn:hover{background:var(--card);border-color:var(--border)}
.iconbtn svg{width:17px;height:17px}
.iconbtn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--em);border:1.5px solid var(--bg)}
#profbtn{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 4px;border-radius:8px;border:1px solid transparent}
#profbtn:hover{background:var(--card);border-color:var(--border)}
.ava{width:28px;height:28px;border-radius:50%;background:var(--em-tint);color:var(--em-deep);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.drop{position:absolute;top:48px;right:0;width:260px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);display:none;z-index:50}
.drop.open{display:block}
.drop .hd{padding:11px 14px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600}
.drop .row{display:flex;gap:10px;padding:10px 14px;width:100%;text-align:left;font-size:12.5px;border-bottom:1px solid var(--border)}
.drop .row:last-child{border-bottom:none}
.drop .row:hover{background:var(--bg)}
.drop .row .t{color:var(--faint);font-size:11px;margin-left:auto;flex-shrink:0}

#main{flex:1;margin-left:224px;padding:80px 24px 40px}
#page{max-width:1160px;margin:0 auto}

/* ── primitives ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card .chd{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--border)}
.card .chd .t{font-size:13px;font-weight:650;letter-spacing:-.01em}
.card .chd .sub{font-size:11.5px;color:var(--faint)}
.card .chd .act{margin-left:auto;font-size:12px;font-weight:600;color:var(--em-deep)}
.card .chd .act:hover{text-decoration:underline}
.pagehd{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.pagehd h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
.pagehd .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.pagehd .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:33px;padding:0 13px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid var(--border-md);background:var(--card);color:var(--ink);transition:background .12s}
.btn:hover{background:var(--bg)}
.btn svg{width:14px;height:14px}
.btn.pri{background:var(--em-deep);border-color:var(--em-deep);color:#fff}
.btn.pri:hover{background:#054e36}
.btn.sm{height:27px;padding:0 10px;font-size:11.5px;border-radius:7px}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--card);border-color:var(--border)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px}
.pill .pd{width:5px;height:5px;border-radius:50%}
.pill.em{background:var(--em-tint);color:var(--em-deep)}.pill.em .pd{background:var(--em)}
.pill.am{background:var(--amber-tint);color:var(--amber)}.pill.am .pd{background:var(--amber)}
.pill.rd{background:var(--red-tint);color:var(--red)}.pill.rd .pd{background:var(--red)}
.pill.gy{background:var(--bg);color:var(--muted)}.pill.gy .pd{background:var(--faint)}
.pill.bl{background:var(--blue-tint);color:var(--blue)}.pill.bl .pd{background:var(--blue)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:1px 6px;background:var(--bg)}
.up{color:var(--em-deep);font-size:11.5px;font-weight:600}
.down{color:var(--red);font-size:11.5px;font-weight:600}

.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.metric{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 15px;cursor:pointer;transition:border-color .12s}
.metric:hover{border-color:var(--border-md)}
.metric .lb{font-size:11.5px;font-weight:500;color:var(--muted);margin-bottom:5px}
.metric .vl{font-size:21px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.metric .sb{font-size:11px;color:var(--faint);margin-top:3px;line-height:1.45}
.metric .sb .up,.metric .sb .down{margin-right:4px}

.lrow{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--border)}
.chd+.lrow{border-top:none}
.lrow.click{cursor:pointer}
.lrow.click:hover{background:var(--bg)}
.lrow .main{min-width:0;flex:1}
.lrow .nm{font-size:13px;font-weight:600}
.lrow .sb{font-size:11.5px;color:var(--faint);margin-top:1px}
.time{font-family:var(--mono);font-size:11px;color:var(--muted);width:58px;flex-shrink:0;font-variant-numeric:tabular-nums}

table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:9px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--bg)}
.tbl .r{text-align:right}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:29px;padding:0 12px;border-radius:99px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--border);background:var(--card)}
.chip:hover{border-color:var(--border-md)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ic{width:38px;height:38px;border-radius:10px;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;color:var(--faint);margin-bottom:10px}
.empty .ic svg{width:18px;height:18px}
.empty .t{font-size:13.5px;font-weight:600;color:var(--ink)}
.empty .s{font-size:12px;margin-top:2px}

/* ── dashboard ── */
.dgrid{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}
.dcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.ai-row{display:flex;gap:11px;padding:12px 16px;border-top:1px solid var(--border);align-items:flex-start}
.chd+.ai-row{border-top:none}
.ai-ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.ai-ic svg{width:14px;height:14px}
.ai-row .tx{font-size:12.5px;line-height:1.45;flex:1}
.ai-row .tx b{font-weight:650}
.ai-row .tx .why{display:block;font-size:11px;color:var(--faint);margin-top:1px}
.pipemini{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:14px 16px}
.pm-col{cursor:pointer}
.pm-bar{height:44px;border-radius:6px;background:var(--em-tint);position:relative;overflow:hidden;margin-bottom:6px}
.pm-fill{position:absolute;bottom:0;left:0;right:0;background:var(--em);opacity:.85;border-radius:6px 6px 0 0}
.pm-col:hover .pm-fill{opacity:1}
.pm-n{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.pm-l{font-size:10px;color:var(--faint);line-height:1.25}
.act-row{display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--border);font-size:12.5px;align-items:baseline}
.chd+.act-row{border-top:none}
.act-row .t{color:var(--faint);font-size:11px;margin-left:auto;flex-shrink:0;font-variant-numeric:tabular-nums}
.act-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}

/* ── pipeline ── */
#board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.bcol{width:218px;flex-shrink:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--r)}
.bcol .bh{padding:10px 12px 8px}
.bcol .bt{font-size:12px;font-weight:650;display:flex;align-items:center;gap:6px}
.bcol .bt .n{color:var(--faint);font-weight:600;font-size:11px}
.bcol .bv{font-size:11px;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums}
.bcol .cards{padding:4px 8px 8px;min-height:70px;display:flex;flex-direction:column;gap:7px}
.bcol.dragover{border-color:var(--em);background:var(--em-tint)}
.lead{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 11px;box-shadow:var(--shadow);cursor:grab}
.lead:active{cursor:grabbing}
.lead.dragging{opacity:.45}
.lead .ln{font-size:12.5px;font-weight:650}
.lead .ls{font-size:11.5px;color:var(--muted);margin:2px 0 7px}
.lead .lf{display:flex;align-items:center;gap:6px}
.lead .lv{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto}
.src{font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--bg);border:1px solid var(--border);color:var(--muted)}

/* ── calendar ── */
#calgrid{display:grid;grid-template-columns:46px repeat(6,1fr);min-width:760px}
#calgrid .chd2{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:8px 4px;border-bottom:1px solid var(--border);border-left:1px solid var(--border)}
#calgrid .chd2 .d{font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
#calgrid .chd2.today .d{color:var(--em-deep)}
.cal-time{font-family:var(--mono);font-size:10px;color:var(--faint);text-align:right;padding:2px 6px 0 0;border-top:1px solid var(--border);height:46px}
.cal-cell{border-left:1px solid var(--border);border-top:1px solid var(--border);height:46px;position:relative}
.cal-day{position:relative;border-left:1px solid var(--border)}
.appt{position:absolute;left:3px;right:3px;border-radius:6px;padding:4px 7px;font-size:10.5px;line-height:1.3;overflow:hidden;border:1px solid;cursor:pointer}
.appt .an{font-weight:650;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt.confirmed{background:var(--em-tint);border-color:var(--em-mid);color:var(--em-deep)}
.appt.progress{background:var(--amber-tint);border-color:#EBD3AC;color:var(--amber)}
.appt.done{background:var(--bg);border-color:var(--border-md);color:var(--muted)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);align-items:center}
.legend .pd{width:8px;height:8px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* ── automations ── */
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.auto{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 16px;display:flex;flex-direction:column;gap:10px}
.auto .ah{display:flex;align-items:flex-start;gap:10px}
.auto .aic{width:32px;height:32px;border-radius:8px;background:var(--em-tint);color:var(--em-deep);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.auto .aic svg{width:15px;height:15px}
.auto .an{font-size:13px;font-weight:650}
.auto .ad{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.4}
.auto .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;border-top:1px solid var(--border);padding-top:10px}
.auto .st .v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.auto .st .l{font-size:10px;color:var(--faint)}
.tog{width:34px;height:20px;border-radius:99px;background:var(--border-md);position:relative;transition:background .15s;flex-shrink:0;margin-left:auto}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.tog.on{background:var(--em)}
.tog.on::after{left:16px}

/* ── analytics ── */
.angrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.hbar{display:flex;align-items:center;gap:10px;padding:5px 0}
.hbar .l{font-size:12px;width:110px;flex-shrink:0;color:var(--muted)}
.hbar .track{flex:1;height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.hbar .fill{height:100%;border-radius:99px;background:var(--em)}
.hbar .v{font-size:12px;font-weight:650;width:64px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0}

/* ── settings ── */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;height:34px;border:1px solid var(--border-md);border-radius:8px;padding:0 11px;background:var(--card);font-size:13px}
.fld textarea{height:auto;padding:8px 11px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--em);outline:none;box-shadow:0 0 0 3px var(--em-tint)}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--border)}
.chd+.setrow{border-top:none}
.setrow .main{flex:1;min-width:0}
.setrow .nm{font-size:13px;font-weight:600}
.setrow .sb{font-size:11.5px;color:var(--faint)}

/* ── profile ── */
.pf-head{display:flex;gap:16px;align-items:flex-start;padding:18px;flex-wrap:wrap}
.pf-ava{width:52px;height:52px;border-radius:12px;background:var(--em-tint);color:var(--em-deep);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;flex-shrink:0}
.pf-stats{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--border)}
.pf-stat{padding:12px 18px;border-left:1px solid var(--border)}
.pf-stat:first-child{border-left:none}
.pf-stat .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.pf-stat .l{font-size:11px;color:var(--faint)}
.banner{display:flex;gap:12px;align-items:center;border:1px solid;border-radius:var(--r);padding:13px 16px;margin-bottom:16px}
.banner.am{background:var(--amber-tint);border-color:#EBD3AC}
.banner.em{background:var(--em-tint);border-color:var(--em-mid)}
.banner .bt2{font-size:13px;font-weight:650}
.banner .bs{font-size:12px;color:var(--muted);margin-top:1px}
.pgrid{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start}
.note{padding:11px 16px;border-top:1px solid var(--border);font-size:12.5px}
.note:first-child{border-top:none}
.note .m{font-size:11px;color:var(--faint);margin-top:2px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 16px}
.photo{aspect-ratio:4/3;border-radius:8px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--faint)}
.photo svg{width:18px;height:18px}
.composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.composer input{flex:1;height:32px;border:1px solid var(--border-md);border-radius:8px;padding:0 11px;font-size:12.5px}

/* ── response / tasks / reviews ── */
.score{font-size:12px;font-weight:800;width:36px;height:25px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.stars{color:#DD9A2B;font-size:12.5px;letter-spacing:1.5px}
.grouphd{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:18px 0 8px}
.grouphd:first-of-type{margin-top:0}
/* ── modal / toast / skeleton ── */
#overlay{position:fixed;inset:0;background:rgba(16,26,21,.4);display:none;align-items:flex-start;justify-content:center;padding:9vh 16px;z-index:90}
#overlay.open{display:flex}
#modal{background:var(--card);border-radius:14px;box-shadow:var(--shadow-lg);width:440px;max-width:100%;overflow:hidden}
#modal .mh{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--border)}
#modal .mh .t{font-size:14px;font-weight:700}
#modal .mb{padding:16px 18px}
#modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:13px 18px;border-top:1px solid var(--border);background:var(--bg)}

function toast(msg,err){

function areaChart(vals,{w=600,h=170,labels=null,fmt=v=>v,area=true}={}){
  const max=Math.max(...vals)*1.12, pad=6;
  const X=i=>pad+i*(w-2*pad)/(vals.length-1), Y=v=>h-14-(v/max)*(h-28);
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  let grid=''; for(let g=1;g<=3;g++){const y=14+(h-28)*g/4;grid+=`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;}
  const lx=X(vals.length-1),ly=Y(vals[vals.length-1]);
  let lab=''; if(labels) labels.forEach((L,i)=>{lab+=`<text x="${X(i)}" y="${h-2}" font-size="9.5" fill="var(--faint)" text-anchor="middle" font-family="var(--font)">${L}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block" role="img" aria-label="chart">${grid}
    ${area?`<polygon points="${pad},${h-14} ${pts} ${lx},${h-14}" fill="var(--em-tint)"/>`:''}
    <polyline points="${pts}" fill="none" stroke="var(--em)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx}" cy="${ly}" r="3.5" fill="var(--em-deep)"/>
    <text x="${lx-6}" y="${ly-8}" font-size="10.5" font-weight="700" fill="var(--em-deep)" text-anchor="end" font-family="var(--font)">${fmt(vals[vals.length-1])}</text>${lab}</svg>`;
}
function barChart(vals,labels,{w=520,h=190,fmt=v=>v}={}){
  const max=Math.max(...vals)*1.15, bw=(w/vals.length)*0.52;
  let out=''; for(let g=1;g<=3;g++){const y=10+(h-34)*g/4;out+=`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="var(--border)"/>`;}
  vals.forEach((v,i)=>{
    const x=(i+0.5)*(w/vals.length)-bw/2, bh=(v/max)*(h-44), y=h-24-bh, last=i===vals.length-1;
    out+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${last?'var(--em-deep)':'var(--em)'}" opacity="${last?1:.55}"><title>${labels[i]}: ${fmt(v)}</title></rect>
    <text x="${x+bw/2}" y="${y-5}" font-size="9.5" font-weight="${last?700:500}" fill="${last?'var(--em-deep)':'var(--faint)'}" text-anchor="middle" font-family="var(--font)">${fmt(v)}</text>
    <text x="${x+bw/2}" y="${h-8}" font-size="10" fill="var(--faint)" text-anchor="middle" font-family="var(--font)">${labels[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block" role="img" aria-label="bar chart">${out}</svg>`;
}
function donut(pct,label){
  const r=34,c=2*Math.PI*r;
  return `<svg viewBox="0 0 90 90" width="108" role="img" aria-label="${pct}% ${label}">
    <circle cx="45" cy="45" r="${r}" fill="none" stroke="var(--em-tint)" stroke-width="9"/>
    <circle cx="45" cy="45" r="${r}" fill="none" stroke="var(--em)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(pct/100*c).toFixed(1)} ${c}" transform="rotate(-90 45 45)"/>
    <text x="45" y="44" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink)" font-family="var(--font)">${pct}%</text>
    <text x="45" y="58" text-anchor="middle" font-size="8.5" fill="var(--faint)" font-family="var(--font)">${label}</text></svg>`;
}

function pgPipe(){

    const cards=PIPE.filter(p=>p.stage===i);
    return `<div class="bcol" data-stage="${i}"><div class="bh"><div class="bt">${s} <span class="n num">${cards.length}</span></div>
      <div class="bv">${fmt$(cards.reduce((x,p)=>x+p.val,0))}</div></div>
      <div class="cards">${cards.map(p=>leadCard(p)).join('')}</div></div>`;}).join('')}</div>`;
  wireDnD();

function leadCard(p){return `<div class="lead" draggable="true" data-id="${p.id}">
  <div class="ln">${esc(p.name)}</div><div class="ls">${esc(p.svc)}</div>
  <div class="lf"><span class="src">${p.src}</span><span class="lv">${fmt$(p.val)}</span></div></div>`;}
function wireDnD(){
  let dragId=null;
  document.querySelectorAll('.lead').forEach(el=>{
    el.addEventListener('dragstart',e=>{dragId=el.dataset.id;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    el.addEventListener('dragend',()=>el.classList.remove('dragging'));
  });
  document.querySelectorAll('.bcol').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('dragover');});
    col.addEventListener('dragleave',()=>col.classList.remove('dragover'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('dragover');
      const p=PIPE.find(x=>x.id===dragId); if(!p)return;
      const to=+col.dataset.stage; if(p.stage===to)return;
      p.stage=to; pgPipe(); toast(`${p.name.split(' ·')[0]} moved to ${STAGES[to]}`);});
  });
}

  openModal('Add lead',`

const DAYS=['Mon 6','Tue 7','Wed 8','Thu 9','Fri 10','Sat 11'];
function pgCal(){

  ${calView==='week'?calWeek():calDayView()}`;

function calWeek(){
  const H0=8,H1=19;
  let head=`<div></div>`+DAYS.map((d,i)=>`<div class="chd2${i===1?' today':''}">${d.split(' ')[0]}<div class="d">${d.split(' ')[1]}</div></div>`).join('');
  let rows='';
  for(let h=H0;h<H1;h++){
    rows+=`<div class="cal-time">${h<=12?h:h-12}${h<12?'a':'p'}</div>`;
    for(let d=1;d<=6;d++) rows+=`<div class="cal-cell" data-h="${h}" data-d="${d}"></div>`;
  }
  setTimeout(()=>{
    APPTS.filter(a=>a.day>=1&&a.day<=6).forEach(a=>{
      const cell=document.querySelector(`.cal-cell[data-h="${Math.floor(a.h)}"][data-d="${a.day}"]`); if(!cell)return;
      const top=(a.h-Math.floor(a.h))*46, hgt=a.dur*46-4;
      cell.insertAdjacentHTML('beforeend',`<div class="appt ${a.st}" style="top:${top}px;height:${hgt}px;z-index:2" onclick="calView='day';calDay=${a.day};pgCal()" title="${esc(a.name)} — ${esc(a.svc)}">
        <div class="an">${esc(a.name)}</div>${a.dur>=1.5?`<div>${esc(a.svc.split(' · ')[0])}</div><div style="font-weight:650">${fmt$(a.val)}</div>`:''}</div>`);
    });
  },0);
  return `<div class="card" style="overflow-x:auto"><div id="calgrid">${head}${rows}</div></div>`;
}
function calDayView(){
  const list=APPTS.filter(a=>a.day===calDay);

  return `<div class="chips" style="margin-bottom:12px">${DAYS.map((d,i)=>`<button class="chip${calDay===i+1?' on':''}" onclick="calDay=${i+1};pgCal()">${d}</button>`).join('')}</div>

  if(a==='send'){q.st='sent';q.date='Jul 8';toast('Quote '+q.id+' texted to '+q.name);}
  if(a==='follow'){toast('Follow-up text sent to '+q.name);}
  if(a==='accept'){q.st='accepted';toast(q.name+' accepted '+fmt$(q.total)+' 🎉');}
  pgQuotes();}
let qitems=[1];
function quoteBody(){
  const total=qitems.reduce((s,ix)=>s+svcPrice(SERVICES[ix]),0);
  return `<div class="fld"><label>Customer</label><select id="q-c">${CUST.map(c=>`<option>${c.name}</option>`).join('')}<option>+ New customer…</option></select></div>
  <label style="display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:4px">Line items</label>
  ${qitems.map((ix,k)=>`<div style="display:flex;gap:8px;margin-bottom:8px">
    <select onchange="qitems[${k}]=this.selectedIndex;refreshQuote()" style="flex:1;height:32px;border:1px solid var(--border-md);border-radius:8px;padding:0 8px;background:var(--card)">${SERVICES.map((s,si)=>`<option${si===ix?' selected':''}>${s}</option>`).join('')}</select>
    <button class="btn sm ghost" style="height:32px" onclick="qitems.splice(${k},1);refreshQuote()" aria-label="Remove item">${I('x',13)}</button></div>`).join('')}
  <button class="btn sm" onclick="qitems.push(0);refreshQuote()">${I('plus',12)}Add item</button>
  <div style="display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-weight:700;font-size:14px">Total <span class="num">${fmt$(total)}</span></div>`;
}
function refreshQuote(){document.querySelector('#modal .mb').innerHTML=quoteBody();}
function openQuoteModal(name){
  qitems=[1];
  openModal('New quote',quoteBody(),'Send quote',()=>{
    const nm=$('#q-c').value, total=qitems.reduce((s,ix)=>s+svcPrice(SERVICES[ix]),0);
    QUOTES.unshift({id:'Q-1049',name:nm,items:qitems.map(ix=>SERVICES[ix].split(' — ')[0]).join(' + '),total,st:'sent',date:'Jul 8'});
    closeModal(); if(location.hash.includes('quotes'))pgQuotes(); toast('Quote texted to '+nm+' with a one-tap accept link');});
  if(name)$('#q-c').value=name;
}

function openModal(title,body,cta,fn){
  $('#modal').innerHTML=`<div class="mh"><span class="t">${title}</span><button class="iconbtn" style="margin-left:auto" onclick="closeModal()" aria-label="Close">${I('x',15)}</button></div>
   <div class="mb">${body}</div>
   <div class="mf"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" id="modalgo">${cta}</button></div>`;
  $('#modalgo').onclick=fn;
  $('#overlay').classList.add('open');
}
function closeModal(){$('#overlay').classList.remove('open');}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
function openBooking(name){
  openModal('New booking',`
   <div class="fld"><label>Customer</label><select id="bk-c">${name?`<option>${name}</option>`:''}${CUST.map(c=>`<option>${c.name}</option>`).join('')}<option>+ New customer…</option></select></div>
   <div class="fld"><label>Service</label><select id="bk-s">${SERVICES.map(s=>`<option>${s}</option>`).join('')}</select></div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
     <div class="fld"><label>Date</label><input id="bk-d" type="date" value="2026-07-09"/></div>
     <div class="fld"><label>Time</label><select id="bk-t"><option>9:00 AM</option><option>10:00 AM</option><option>11:30 AM</option><option>1:00 PM</option><option>2:30 PM</option><option>4:00 PM</option></select></div></div>`,
   'Book appointment',()=>{
    const nm=$('#bk-c').value, sv=$('#bk-s').value, tm=$('#bk-t').value;
    const v=+(sv.match(/\$([\d,]+)/)||[0,100])[1].replace(',','');
    const c=CUST.find(x=>x.name===nm);
    const hr=(t=>{let[a,b]=t.split(' ');let[h,m]=a.split(':').map(Number);if(b==='PM'&&h!==12)h+=12;return h+m/60;})(tm);
    APPTS.push({t:tm,h:hr,dur:1.5,day:3,name:nm,cid:c?c.id:0,svc:sv.split(' — ')[0],val:v,st:'confirmed'});
    closeModal(); toast(`Booked: ${nm} — ${tm} tomorrow. Confirmation text sent.`);
    if(location.hash.includes('calendar'))pgCal();});
}
document.getElementById('newbook').addEventListener('click',()=>openBooking());
