<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="ShopFlow"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<link rel="icon" type="image/png" href="/icons/icon-192.png"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>ShopFlow</title>
<link rel="stylesheet" href="/css/app2.css"/>
<script>window.SF_V2 = true;</script>
</head>
<body>

<!-- Loading screen -->
<div id="loading">
  <div id="loading-logo"><img src="/icons/icon-192.png" style="width:52px;height:52px;border-radius:14px;display:block;" /></div>
  <div id="loading-title">ShopFlow</div>
  <div id="loading-sub">Loading your shop...</div>
  <div class="loading-dots">
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
  </div>
</div>

<!-- Mobile sidebar backdrop -->
<div id="sidebar-backdrop" onclick="closeSidebar()"></div>

<!-- Topbar -->
<div id="topbar">
  <button id="topbar-menu-btn" onclick="toggleSidebar()" aria-label="Menu">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="5" x2="17" y2="5"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="15" x2="17" y2="15"/>
    </svg>
  </button>
  <img id="topbar-logo" src="/icons/icon-192.png" style="width:28px;height:28px;border-radius:8px;" />
  <div id="topbar-title">ShopFlow</div>
<script>document.addEventListener("DOMContentLoaded",()=>{const n=localStorage.getItem("sf_shopName");if(n)document.getElementById("topbar-title").textContent=n;});</script>
</div>

<!-- App -->
<div id="app">
  <!-- Sidebar -->
  <div id="sidebar">
    <div style="padding:15px 18px 12px;border-bottom:1px solid var(--border);margin-bottom:4px;display:flex;align-items:center;gap:10px;">
      <img src="/icons/icon-192.png" style="width:32px;height:32px;border-radius:9px;flex-shrink:0;" />
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="sidebar-brand-name">ShopFlow</div>
        <div id="sidebar-shop-name" style="font-size:11px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Your Shop</div>
      </div>
      <button id="sidebar-close-btn" onclick="closeSidebar()" style="background:none;border:none;color:var(--faint);cursor:pointer;padding:4px;border-radius:6px;display:none;">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="4" x2="14" y2="14"/><line x1="14" y1="4" x2="4" y2="14"/></svg>
      </button>
    </div>
    <div id="sidebar-nav"></div>
    <div id="sidebar-footer">
      Powered by <strong style="color:var(--green-deep);">ShopFlow</strong>
    </div>
  </div>

  <!-- Main content -->
  <div id="main">
    <div id="page-dashboard"    class="page active"></div>
    <div id="page-messages"     class="page"></div>
    <div id="page-appointments" class="page"></div>
    <div id="page-jobs"         class="page"></div>
    <div id="page-properties"   class="page"></div>
    <div id="page-crews"        class="page"></div>
    <div id="page-recurring"    class="page"></div>
    <div id="page-response"     class="page"></div>
    <div id="page-leads"        class="page"></div>
    <div id="page-clients"      class="page"></div>
    <div id="page-quotes"       class="page"></div>
    <div id="page-revenue"      class="page"></div>
    <div id="page-tasks"        class="page"></div>
    <div id="page-reviews"      class="page"></div>
    <div id="page-automations"  class="page"></div>
    <div id="page-settings"     class="page"></div>
  </div>
</div>

<!-- Bottom nav (mobile) -->
<div id="bottom-nav">
  <button class="bottom-nav-item active" data-page="dashboard" onclick="App.nav('dashboard')"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>Home</button>
  <button class="bottom-nav-item" data-page="appointments" onclick="App.nav('appointments')"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="9.5" x2="21" y2="9.5"/></svg></span>Bookings</button>
  <button class="bottom-nav-item" data-page="messages" onclick="App.nav('messages')" style="position:relative;">
    <span class="bottom-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>Messages
    <span id="bottom-msg-badge" style="display:none;position:absolute;top:2px;right:calc(50% - 18px);background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:100px;line-height:1.4;"></span>
  </button>
  <button class="bottom-nav-item" data-page="revenue" onclick="App.nav('revenue')"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="21" x2="21" y2="21"/><line x1="7" y1="21" x2="7" y2="13"/><line x1="12" y1="21" x2="12" y2="5"/><line x1="17" y1="21" x2="17" y2="9"/></svg></span>Revenue</button>
  <button class="bottom-nav-item" data-page="settings" onclick="App.nav('settings')"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2.2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2.2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2.2"/></svg></span>Settings</button>
</div>

<!-- Global client profile overlay -->
<div id="cp-overlay">
  <div id="cp-header">
    <button id="cp-back-btn" onclick="ClientProfile.close()">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="13 16 7 10 13 4"/>
      </svg>
    </button>
    <div id="cp-header-name">Client Profile</div>
    <div style="width:36px;"></div>
  </div>
  <div id="cp-body"></div>
</div>

<!-- Modal -->
<div id="modal-overlay">
  <div id="modal-box"></div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script src="/js/api.js"></script>
<script>if(!localStorage.getItem("sf_token")){try{sessionStorage.setItem("sf_next",location.pathname+location.search);}catch(e){}window.location.href="/login";}</script>
<script src="/js/utils.js"></script>
<script src="/js/pwa-push-client.js"></script>
<script src="/js/client-profile.js"></script>
<script src="/js/pages/dashboard.js"></script>
<script src="/js/pages/appointments.js"></script>
<script src="/js/pages/leads.js"></script>
<script src="/js/pages/clients.js"></script>
<script src="/js/pages/quotes.js"></script>
<script src="/js/pages/revenue.js"></script>
<script src="/js/pages/reviews.js"></script>
<script src="/js/pages/automations.js"></script>
<script src="/js/pages/settings.js"></script>
<script src="/js/pages/messages.js"></script>
<script src="/js/pages/jobs.js"></script>
<script src="/js/pages/properties.js"></script>
<script src="/js/pages/crews.js"></script>
<script src="/js/pages/recurring.js"></script>
<script src="/js/pages/tasks.js"></script>
<script src="/js/pages/response.js"></script>
<script src="/js/v2/dashboard2.js"></script>
<script src="/js/v2/clients2.js"></script>
<script src="/js/v2/leads2.js"></script>
<script src="/js/v2/appointments2.js"></script>
<script src="/js/v2/pages2.js"></script>
<script src="/js/registry.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
